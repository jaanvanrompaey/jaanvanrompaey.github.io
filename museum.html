  <script>
    const fileInput = document.getElementById('fileInput');
    const previewSection = document.getElementById('previewSection');
    const originalPreview = document.getElementById('originalPreview');
    const originalInfo = document.getElementById('originalInfo');
    const convertBtn = document.getElementById('convertBtn');
    const stepsSection = document.getElementById('stepsSection');
    const stepsBox = document.getElementById('stepsBox');
    const resultSection = document.getElementById('resultSection');
    const finalPreview = document.getElementById('finalPreview');
    const downloadLink = document.getElementById('downloadLink');
    const resetBtn = document.getElementById('resetBtn');

    const delay = ms => new Promise(r => setTimeout(r, ms));

    function canvasToBlob(canvas, mimeType = 'image/jpeg', quality = 0.85) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error('Canvas toBlob failed. Check browser compatibility.'));
        }, mimeType, quality);
      });
    }

    // ✅ HEAVIER COLOR BLOCKING ALGORITHM
    function renderBlockStyle(img, targetW, targetH, blockSize = 8) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      // 1. Calculate grid size based on block size
      const gridW = Math.max(1, Math.ceil(targetW / blockSize));
      const gridH = Math.max(1, Math.ceil(targetH / blockSize));

      // 2. Render to a small intermediate canvas (nearest-neighbor)
      const offCanvas = document.createElement('canvas');
      offCanvas.width = gridW;
      offCanvas.height = gridH;
      const offCtx = offCanvas.getContext('2d');
      offCtx.imageSmoothingEnabled = false;
      offCtx.drawImage(img, 0, 0, gridW, gridH);

      // 3. Scale the small grid back up to target dimensions (nearest-neighbor)
      canvas.width = targetW;
      canvas.height = targetH;
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(offCanvas, 0, 0, targetW, targetH);

      return canvas;
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      const url = URL.createObjectURL(file);
      originalPreview.src = url;
      originalInfo.textContent = `${file.name} | ${(file.size/1024).toFixed(2)} KB | ${file.type.split('/')[1].toUpperCase()}`;
      
      previewSection.classList.remove('hidden');
      stepsSection.classList.add('hidden');
      resultSection.classList.add('hidden');
      convertBtn.disabled = false;
    });

    resetBtn.addEventListener('click', () => {
      fileInput.value = '';
      previewSection.classList.add('hidden');
      stepsSection.classList.add('hidden');
      resultSection.classList.add('hidden');
      stepsBox.innerHTML = '';
    });

    convertBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) return;
      
      convertBtn.disabled = true;
      stepsSection.classList.remove('hidden');
      resultSection.classList.add('hidden');
      stepsBox.innerHTML = '';

      // ✅ Updated options with heavier blocking
      const options = {
        targetSizeBytes: 512,
        qualityStep: 30,
        dimensionStep: 0.12,
        maxIterations: 20,
        stallThreshold: 50,
        maxStalls: 5,
        MIN_DIM: 25,
        blockSize: 16 // ⬅️ Higher = heavier/more aggressive color blocking (8, 16, 32)
      };

      try {
        const img = await loadImage(file);
        const baseName = file.name.replace(/\.[^/.]+$/, "");
        const origW = img.naturalWidth;
        const origH = img.naturalHeight;

        let prevFileSize = 0;
        let stallCount = 0;
        let finalResult = null;

        for (let i = 1; i <= options.maxIterations; i++) {
          // ✅ LINEAR DIMENSION REDUCTION (Matches Python)
          const reductionFactor = Math.max(0, 1 - (i * options.dimensionStep));
          let currentW = Math.max(options.MIN_DIM, Math.floor(origW * reductionFactor));
          let currentH = Math.max(options.MIN_DIM, Math.floor(origH * reductionFactor));

          // ✅ LINEAR QUALITY REDUCTION (Matches Python)
          const currentQuality = Math.max(1, 100 - (i * options.qualityStep));
          const qualityNorm = currentQuality / 100;

          // Render & Compress (using heavier block algorithm)
          const blockCanvas = renderBlockStyle(img, currentW, currentH, options.blockSize);
          const blob = await canvasToBlob(blockCanvas, 'image/jpeg', qualityNorm);
          const fileSize = blob.size;

          // UI Step Rendering
          const stepDiv = document.createElement('div');
          stepDiv.className = 'step-row';
          
          const thumbUrl = URL.createObjectURL(blob);
          const thumb = document.createElement('img');
          thumb.src = thumbUrl;
          thumb.className = 'step-thumb';
          
          const info = document.createElement('div');
          info.className = 'step-info';
          info.textContent = `[${i}] ${currentW}x${currentH} | Q:${currentQuality} | ${fileSize} bytes`;
          
          stepDiv.appendChild(thumb);
          stepDiv.appendChild(info);
          stepsBox.appendChild(stepDiv);
          stepsBox.scrollTop = stepsBox.scrollHeight;

          await delay(150); // UI yield for visible progression

          // ✅ Success Check (Matches Python)
          if (fileSize <= options.targetSizeBytes) {
            info.classList.add('success');
            info.textContent = `[${i}] ✅ Success! Final file: ${currentW}x${currentH} (${fileSize} bytes)`;
            finalResult = { blob, name: `${baseName}_optimized.jpg`, size: fileSize };
            break;
          }

          // ✅ Stall Detection (Matches Python exactly)
          if (prevFileSize > 0 && Math.abs(fileSize - prevFileSize) < options.stallThreshold) {
            stallCount++;
            if (stallCount >= options.maxStalls) {
              info.classList.add('stalled');
              info.textContent = `[${i}] ⚠️ Linear optimization stalled. Returning best available: ${currentW}x${currentH}`;
              finalResult = finalResult || { blob, name: `${baseName}_optimized.jpg`, size: fileSize };
              break;
            }
          } else {
            stallCount = 0;
          }
          prevFileSize = fileSize;

          // Track best result so far for fallback
          if (!finalResult || fileSize < finalResult.size) {
            finalResult = { blob, name: `${baseName}_optimized.jpg`, size: fileSize };
          }
        }

        // Clean up thumbnail URLs to prevent memory leaks
        document.querySelectorAll('.step-thumb').forEach(thumb => URL.revokeObjectURL(thumb.src));

        if (finalResult) {
          const url = URL.createObjectURL(finalResult.blob);
          finalPreview.src = url;
          resultSection.classList.remove('hidden');
          downloadLink.href = url;
          downloadLink.download = finalResult.name;
        } else {
          const warning = document.createElement('div');
          warning.className = 'step-info error';
          warning.textContent = `⚠️ Warning: Could not reach ≤${options.targetSizeBytes} bytes.`;
          stepsBox.appendChild(warning);
        }
      } catch (e) {
        console.error(e);
        const errorDiv = document.createElement('div');
        errorDiv.className = 'step-info error';
        errorDiv.textContent = `❌ Error: ${e.message}`;
        stepsBox.appendChild(errorDiv);
      } finally {
        convertBtn.disabled = false;
      }
    });

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          if (img.naturalWidth === 0 || img.naturalHeight === 0) {
            reject(new Error('Invalid or unsupported image file.'));
          } else {
            resolve(img);
          }
        };
        img.onerror = () => reject(new Error('Failed to load image. Try a different file format.'));
        img.src = URL.createObjectURL(file);
      });
    }
  </script>
