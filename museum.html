<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUSEUM OF OPTIMISED ART</title>
  <style>
    /* === MUSEUM AESTHETIC (Monotone & 20px Spacing) === */
    :root {
      --font-main: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --color-bg: #ffffff;
      --color-text: #000000;
      --border-width: 2px;
      --border-color: #000000;
      --spacing: 20px;
      --gray-placeholder: #cccccc;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-main);
      background: var(--color-bg);
      color: var(--color-text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      padding: var(--spacing);
      border-bottom: var(--border-width) solid var(--border-color);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 800;
    }

    /* Main Layout */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: var(--spacing);
      overflow-y: auto; /* Allow scroll if too many steps */
    }

    /* Upload State */
    #uploadState {
      display: flex;
      flex: 1;
      justify-content: flex-end;
      align-items: flex-end;
    }

    .museum-btn {
      background: transparent;
      border: var(--border-width) solid var(--border-color);
      padding: 15px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .museum-btn:hover {
      background: var(--color-text);
      color: var(--color-bg);
    }

    /* Gallery / Steps Grid */
    #galleryState {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    /* The Dynamic Grid */
    .steps-grid {
      display: grid;
      /* Auto-fill columns, but keep them roughly equal size */
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
      gap: var(--spacing);
      height: 100%;
    }

    /* Individual Block (Step or Final) */
    .step-slot {
      border: var(--border-width) solid var(--border-color);
      aspect-ratio: 1 / 1; /* Keeps them square */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--gray-placeholder);
      position: relative;
    }

    .step-slot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .step-slot.loaded img {
      display: block;
    }

    .step-label {
      margin-top: 5px;
      font-size: 0.7rem;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.2;
    }

    /* Submit Button Overlay (Bottom Right) */
    #submitArea {
      position: fixed;
      bottom: var(--spacing);
      right: var(--spacing);
      z-index: 10;
    }

    /* Hidden Input */
    #fileInput {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>MUSEUM OF OPTIMISED ART</h1>
  </header>

  <main>
    <!-- 1. Initial Upload State -->
    <div id="uploadState">
      <label for="fileInput" class="museum-btn">
        UPLOAD IMAGE
      </label>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <!-- 2. Processing / Gallery State -->
    <div id="galleryState">
      <!-- Dynamic Grid Container -->
      <div class="steps-grid" id="stepsGrid">
        <!-- Slots generated by JS -->
      </div>
    </div>
  </main>

  <!-- Submit Button (Always visible once processing starts) -->
  <div id="submitArea" style="display: none;">
    <button class="museum-btn" onclick="alert('Work submitted to the museum archive.')">
      SUBMIT WORK
    </button>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const uploadState = document.getElementById('uploadState');
    const galleryState = document.getElementById('galleryState');
    const stepsGrid = document.getElementById('stepsGrid');
    const submitArea = document.getElementById('submitArea');

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // UI Transition
      uploadState.style.display = 'none';
      galleryState.style.display = 'flex';
      submitArea.style.display = 'block';
      
      // Clear previous results
      stepsGrid.innerHTML = '';

      try {
        const img = await loadImage(file);
        const baseName = file.name.replace(/\.[^/.]+$/, "");
        const origW = img.naturalWidth;
        const origH = img.naturalHeight;

        // Options: Allow up to 15 steps to be safe, but usually hits target sooner
        const options = {
          targetSizeBytes: 512,
          qualityStep: 20,
          dimensionStep: 0.2,
          maxIterations: 15, 
          MIN_DIM: 25,
          blockSize: 8
        };

        let prevFileSize = 0;
        let finalResult = null;

        // Dynamic Loop: Generates as many blocks as needed
        for (let i = 1; i <= options.maxIterations; i++) {
          
          // Create a new DOM Slot for this step
          const slot = document.createElement('div');
          slot.className = 'step-slot';
          
          const slotImg = document.createElement('img');
          slotImg.alt = `Step ${i}`;
          
          const slotLabel = document.createElement('div');
          slotLabel.className = 'step-label';
          slotLabel.innerText = `STEP ${i}: --- BYTES`;
          
          slot.appendChild(slotImg);
          slot.appendChild(slotLabel);
          stepsGrid.appendChild(slot);

          // --- OPTIMIZATION LOGIC ---
          
          // Linear Dimension Reduction
          const reductionFactor = Math.max(0, 1 - (i * options.dimensionStep));
          let currentW = Math.max(options.MIN_DIM, Math.floor(origW * reductionFactor));
          let currentH = Math.max(options.MIN_DIM, Math.floor(origH * reductionFactor));

          // Linear Quality Reduction
          const currentQuality = Math.max(1, 100 - (i * options.qualityStep));
          const qualityNorm = currentQuality / 100;

          // Render (Heavy Block Algorithm)
          const blockCanvas = renderBlockStyle(img, currentW, currentH, options.blockSize);
          const blob = await canvasToBlob(blockCanvas, 'image/jpeg', qualityNorm);
          const fileSize = blob.size;

          // Update UI for this specific step
          slotImg.src = URL.createObjectURL(blob);
          slotLabel.innerText = `STEP ${i}: ${fileSize} BYTES`;
          slot.classList.add('loaded');

          // Success Check
          if (fileSize <= options.targetSizeBytes) {
            finalResult = { blob, name: `${baseName}_optimized.jpg`, size: fileSize };
            break; // Stop processing, we found the target
          }

          // Stall Detection (Optional safety break)
          if (prevFileSize > 0 && Math.abs(fileSize - prevFileSize) < 50) {
             finalResult = finalResult || { blob, name: `${baseName}_optimized.jpg`, size: fileSize };
             break;
          }
          
          // Track best result just in case
          if (!finalResult || fileSize < finalResult.size) {
            finalResult = { blob, name: `${baseName}_optimized.jpg`, size: fileSize };
          }

          prevFileSize = fileSize;
          
          // Delay for "one by one" reveal
          await new Promise(r => setTimeout(r, 800)); 
        }

        // Label the final block (if not already labeled by success check)
        if (finalResult) {
           // Find the last slot we created
           const lastSlot = stepsGrid.lastElementChild;
           if(lastSlot) {
             const lastLabel = lastSlot.querySelector('.step-label');
             lastLabel.innerText = `FINAL STEP: ${finalResult.size} BYTES`;
           }
        }

      } catch (e) {
        alert("Error: " + e.message);
        // Reset to upload state
        uploadState.style.display = 'flex';
        galleryState.style.display = 'none';
        submitArea.style.display = 'none';
      }
    });

    // Helper: Canvas to Blob
    function canvasToBlob(canvas, mimeType = 'image/jpeg', quality = 0.85) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error('Canvas toBlob failed.'));
        }, mimeType, quality);
      });
    }

    // Helper: Heavy Block Rendering (Nearest Neighbor)
    function renderBlockStyle(img, targetW, targetH, blockSize = 8) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      
      // Calculate grid size based on block size
      const gridW = Math.max(1, Math.ceil(targetW / blockSize));
      const gridH = Math.max(1, Math.ceil(targetH / blockSize));

      // Render to small intermediate canvas
      const offCanvas = document.createElement('canvas');
      offCanvas.width = gridW;
      offCanvas.height = gridH;
      const offCtx = offCanvas.getContext('2d');
      offCtx.imageSmoothingEnabled = false;
      offCtx.drawImage(img, 0, 0, gridW, gridH);

      // Scale back up (Nearest Neighbor = Blocky Look)
      canvas.width = targetW;
      canvas.height = targetH;
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(offCanvas, 0, 0, targetW, targetH);
      return canvas;
    }

    // Helper: Load Image
    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          if (img.naturalWidth === 0 || img.naturalHeight === 0) {
            reject(new Error('Invalid image.'));
          } else {
            resolve(img);
          }
        };
        img.onerror = () => reject(new Error('Failed to load image.'));
        img.src = URL.createObjectURL(file);
      });
    }
  </script>
</body>
</html>
