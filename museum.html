<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUSEUM OF OPTIMISED ART</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* === MUSEUM AESTHETIC === */
    :root {
      --font-main: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --color-bg: #ffffff;
      --color-text: #000000;
      --border-width: 2px;
      --border-color: #000000;
      --corner-pad: 40px;
    }

    body {
      margin: 0; padding: 0; font-family: var(--font-main);
      background: var(--color-bg); color: var(--color-text);
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    header {
      padding: 20px; border-bottom: var(--border-width) solid var(--border-color);
      text-align: center; flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding-left: var(--corner-pad); padding-right: var(--corner-pad);
    }
    h1 { margin: 0; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; }
    .header-subtitle { font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase; opacity: 0.5; }

    main { flex: 1; display: flex; flex-direction: column; padding: 40px; gap: 15px; overflow: hidden; }

    /* === UPLOAD / GALLERY STATE === */
    #uploadState {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;  /* <-- ADD THIS: constrain children so they can't break out */
    }

    /* --- Fixed upload button (bottom-right, always visible) --- */
    #uploadBtnWrapper {
      position: fixed;
      bottom: 60px;
      right: 40px;
      z-index: 100;
    }

    .museum-btn {
      background: var(--color-bg); border: var(--border-width) solid var(--border-color);
      padding: 15px 30px; font-size: 1.2rem; font-weight: bold; text-transform: uppercase;
      cursor: pointer; transition: background 0.2s, color 0.2s; font-family: var(--font-main); letter-spacing: 1px;
    }
    .museum-btn:hover { background: var(--color-text); color: var(--color-bg); }
    .museum-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .museum-btn:disabled:hover { background: transparent; color: var(--color-text); }
    #fileInput { display: none; }

    .gallery-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;          /* keep container itself from scrolling */
      padding-right: 20px;       /* room for scrollbar */
      min-height: 0;
    }

    .gallery-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      flex-shrink: 0;
    }
    .gallery-header h2 { margin: 0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; }
    .gallery-count { font-size: 0.7rem; text-transform: uppercase; opacity: 0.5; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 15px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #000 transparent;
      padding-bottom: 10px;
      max-height: 100%;  
    }
    .gallery-grid::-webkit-scrollbar { width: 4px; }
    .gallery-grid::-webkit-scrollbar-track { background: transparent; }
    .gallery-grid::-webkit-scrollbar-thumb { background: #000; border-radius: 2px; }

    .gallery-item { position: relative; overflow: hidden; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; aspect-ratio: 1 / 1; }
    .gallery-item:hover { transform: scale(1.02); }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .gallery-item-overlay {
      position: absolute; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 1);
      padding: 6px 10px; font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.5px;
      display: flex; justify-content: flex-start; align-items: flex-end; gap: 8px;
    }
    .gallery-item-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 85%; }
    .gallery-item-date { opacity: 0.5; white-space: nowrap; }

    .gallery-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
      gap: 15px;
      opacity: 0.4;
    }
    .gallery-empty p { margin: 0; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }

    /* === OPTIMIZATION STATE (EXACTLY ORIGINAL) === */
    #galleryState {
      display: none;
      flex: 1;
      flex-direction: column;
      gap: 40px;
      height: 100%;
      position: relative;
    }

    .steps-row {
      display: flex;
      max-height: 40vh;
      gap: 40px;
      width: fit-content;
      padding-right: var(--corner-pad);
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      flex-shrink: 0;
    }
    .steps-row::-webkit-scrollbar { display: none; }

    .step-slot img {
      object-fit: contain;
      display: block;
      border: 1px solid #000;
    }

    .step-label {
      width: 100%;
      margin-top: 5px;
      font-size: 0.7rem;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bottom-section {
      display: flex;
      height: 55%;
      position: relative;
      flex: 1;
    }

    #finalArea {
      position: absolute;
      display: flex;
      flex-direction: column;
      bottom: 0px;
      left: 0px;
      align-items: flex-start;
    }

    #finalImage {
      height: 50vh;
      object-fit: contain;
      width: auto;
      display: block;
      border: 1px solid #000;
    }

    #finalLabel {
      margin-top: 10px;
      font-size: 0.8rem;
      text-transform: uppercase;
      text-align: left;
    }

    #submitArea {
      position: absolute;
      bottom: 0px;
      right: 0px;
    }
    #backBtn { position: absolute; top: 0; left: 0; z-index: 10; font-size: 0.7rem; padding: 8px 16px; }

    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--color-text); border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--color-text); color: var(--color-bg); padding: 12px 24px;
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;
      border: var(--border-width) solid var(--color-text); transition: transform 0.3s ease;
      z-index: 1000; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    .lightbox { display: none; position: fixed; inset: 0; background: rgba(255, 255, 255, 0.97); z-index: 999; flex-direction: column; align-items: center; justify-content: center; padding: 80px 40px 40px; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 90%; height: 70vh; object-fit: contain; border: var(--border-width) solid var(--color-text); }
    .lightbox-info { margin-top: 15px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
    .lightbox-close {
      position: absolute; top: 20px; right: 30px; background: transparent;
      border: var(--border-width) solid var(--color-text); padding: 8px 16px;
      font-family: var(--font-main); font-size: 0.7rem; text-transform: uppercase;
      cursor: pointer; letter-spacing: 1px;
    }
    .lightbox-close:hover { background: var(--color-text); color: var(--color-bg); }

    /* === NAME MODAL === */
    .name-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(255, 255, 255, 0.92); z-index: 2000; flex-direction: column; align-items: center; justify-content: center; }
    .name-modal-overlay.open { display: flex; }
    .name-modal { background: var(--color-bg); border: var(--border-width) solid var(--border-color); padding: 40px; max-width: 440px; width: 90%; text-align: center; }
    .name-modal h3 { margin: 0 0 20px 0; font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; }
    .name-modal input {
      width: 100%; padding: 12px 16px; font-size: 1rem; font-family: var(--font-main);
      border: var(--border-width) solid var(--border-color); background: transparent;
      color: var(--color-text); text-transform: uppercase; letter-spacing: 1px; box-sizing: border-box; outline: none;
    }
    .name-modal input:focus { background: var(--color-text); color: var(--color-bg); }
    .name-modal-actions { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
    .name-modal-actions .museum-btn { font-size: 0.8rem; padding: 10px 24px; }
    .name-modal-hint { margin-top: 10px; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.4; }

    @media (max-width: 600px) {
      :root { --corner-pad: 20px; }
      h1 { font-size: 1rem; }
      .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
      .steps-row { gap: 20px; }
      #uploadBtnWrapper { bottom: 16px; right: 16px; }
      .museum-btn { padding: 12px 20px; font-size: 1rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>MUSEUM OF OPTIMISED ART</h1>
    <span class="header-subtitle" id="headerSubtitle">EST. 2025</span>
  </header>

  <main>
    <!-- 1. Initial Upload / Gallery State -->
    <div id="uploadState">
      <!-- Upload button is now FIXED outside of the flex flow -->
      <div id="uploadBtnWrapper">
        <label for="fileInput" class="museum-btn">UPLOAD IMAGE</label>
        <input type="file" id="fileInput" accept="image/*">
      </div>
      <div class="gallery-container" id="galleryContainer">
        <div class="gallery-header">
          <h2>Collection</h2>
          <span class="gallery-count" id="galleryCount">0 WORKS</span>
        </div>
        <div class="gallery-grid" id="galleryGrid"></div>
        <div class="gallery-empty" id="galleryEmpty">
          <p>No works in the collection yet.</p>
          <p>Upload an image to begin optimising.</p>
        </div>
      </div>
    </div>

    <!-- 2. OPTIMIZATION STATE -->
    <div id="galleryState">

      <div class="steps-row" id="stepsRow"></div>
      <div class="bottom-section">
        <div id="finalArea">
          <img id="finalImage" alt="Final Result" style="display:none;">
          <div id="finalLabel">AWAITING WORK...</div>
        </div>
        <div id="submitArea">
          <button class="museum-btn" id="submitBtn" onclick="openNameModal()">SUBMIT WORK</button>
        </div>

      </div>
    </div>
  </main>

  <!-- NAME INPUT MODAL -->
  <div class="name-modal-overlay" id="nameModal">
    <div class="name-modal">
      <h3>Name This Work</h3>
      <input type="text" id="nameInput" placeholder="Untitled" maxlength="60" autocomplete="off">
      <p class="name-modal-hint">Press Enter to confirm or click Submit</p>
      <div class="name-modal-actions">
        <button class="museum-btn" onclick="cancelNameModal()">CANCEL</button>
        <button class="museum-btn" onclick="confirmNameSubmit()">CONFIRM</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">CLOSE</button>
    <img id="lightboxImage" src="" alt="View">
    <div class="lightbox-info" id="lightboxInfo"></div>
  </div>

  <script>
    const { createClient } = window.supabase;
    const SUPABASE_URL = 'https://atcbncgpnhpogjnklwut.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0Y2JuY2dwbmhwb2dqbmtsd3V0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NTkzMzEsImV4cCI6MjEwNDQzNTMzMX0.2CowrwZ0tA8t1HYoT-xVeYV6tVY9jgnmhfnPV3Z0Hzs';
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const ARTWORKS_TABLE = 'artworks';
    const ARTWORKS_BUCKET = 'museum-artworks';

    const fileInput = document.getElementById('fileInput');
    const uploadState = document.getElementById('uploadState');
    const galleryState = document.getElementById('galleryState');
    const stepsRow = document.getElementById('stepsRow');
    const finalArea = document.getElementById('finalArea');
    const finalImage = document.getElementById('finalImage');
    const finalLabel = document.getElementById('finalLabel');
    const galleryGrid = document.getElementById('galleryGrid');
    const galleryEmpty = document.getElementById('galleryEmpty');
    const galleryCount = document.getElementById('galleryCount');
    const galleryContainer = document.getElementById('galleryContainer');
    const submitBtn = document.getElementById('submitBtn');
    const toast = document.getElementById('toast');
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');
    const lightboxInfo = document.getElementById('lightboxInfo');

    const nameModal = document.getElementById('nameModal');
    const nameInput = document.getElementById('nameInput');

    let artworks = [];

    async function loadGallery() {
      try {
        const { data, error } = await sb.from(ARTWORKS_TABLE).select('*').order('created_at', { ascending: false });
        if (error) { console.error('Error loading gallery:', error); showToast('Failed to load collection. Check credentials & policies.'); return; }
        artworks = data || [];
        renderGallery();
      } catch (e) { console.error('Gallery load error:', e); }
    }

    function renderGallery() {
      galleryGrid.innerHTML = '';
      if (artworks.length === 0) { galleryEmpty.style.display = 'flex'; galleryCount.textContent = '0 WORKS'; return; }
      galleryEmpty.style.display = 'none';
      galleryCount.textContent = `${artworks.length} WORK${artworks.length !== 1 ? 'S' : ''}`;

      artworks.forEach(artwork => {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        const img = document.createElement('img');
        img.src = artwork.image_url; img.alt = artwork.name || 'Untitled'; img.loading = 'lazy';
        
        const overlay = document.createElement('div');
        overlay.className = 'gallery-item-overlay';
        
        const nameLabel = document.createElement('span');
        nameLabel.className = 'gallery-item-name';
        nameLabel.textContent = artwork.name || 'Untitled';
        
        const dateLabel = document.createElement('span');
        dateLabel.className = 'gallery-item-date';
        dateLabel.textContent = new Date(artwork.created_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: '2-digit' });

        overlay.appendChild(nameLabel);
        overlay.appendChild(dateLabel);
        item.appendChild(img);
        item.appendChild(overlay);
        item.addEventListener('click', () => openLightbox(artwork));
        galleryGrid.appendChild(item);
      });
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024, sizes = ['B', 'KB', 'MB'], i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function openLightbox(artwork) {
      lightboxImage.src = artwork.image_url;
      const d = new Date(artwork.created_at);
      lightboxInfo.textContent = `${artwork.name || 'Untitled'} — ${formatBytes(artwork.file_size)} — ${d.toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' })}`;
      lightbox.classList.add('open');
    }

    function closeLightbox() { lightbox.classList.remove('open'); }
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

    function openNameModal() {
      const finalSrc = finalImage.src;
      if (!finalSrc || finalImage.style.display === 'none') { showToast('No work to submit.'); return; }
      
      const defaultName = (finalImage.alt || 'Untitled').replace(/[^a-zA-Z0-9 _-]/g, '');
      nameInput.value = defaultName || 'Untitled';
      nameModal.classList.add('open');
      setTimeout(() => { nameInput.focus(); nameInput.select(); }, 100);
    }

    function cancelNameModal() { nameModal.classList.remove('open'); }

    function confirmNameSubmit() {
      const name = nameInput.value.trim() || 'Untitled';
      nameModal.classList.remove('open');
      submitWork(name);
    }

    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); confirmNameSubmit(); }
      if (e.key === 'Escape') cancelNameModal();
    });

    async function submitWork(name) {
      const finalSrc = finalImage.src;
      if (!finalSrc || finalImage.style.display === 'none') { showToast('No work to submit.'); return; }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>UPLOADING...';

      try {
        const response = await fetch(finalSrc);
        const blob = await response.blob();

        const safeName = (name || 'Untitled').replace(/[^a-zA-Z0-9 _-]/g, '');
        const fileName = safeName.replace(/ /g, '_') + '_' + Date.now() + '.jpg';

        const { data: uploadData, error: uploadError } = await sb.storage.from(ARTWORKS_BUCKET).upload(fileName, blob, { contentType: 'image/jpeg', cacheControl: '3600', upsert: false });
        if (uploadError) { console.error('Storage upload error:', uploadError); showToast('Upload failed. Check Supabase config & policies.'); submitBtn.disabled = false; submitBtn.textContent = 'SUBMIT WORK'; return; }

        const { data: urlData } = sb.storage.from(ARTWORKS_BUCKET).getPublicUrl(fileName);
        const publicUrl = urlData.publicUrl;

        const { data: dbData, error: dbError } = await sb.from(ARTWORKS_TABLE).insert([{ name: safeName || 'Untitled', file_size: blob.size, image_url: publicUrl, storage_path: uploadData.path }]).select().single();
        if (dbError) { console.error('Database insert error:', dbError); showToast('Database save failed. Check policies.'); submitBtn.disabled = false; submitBtn.textContent = 'SUBMIT WORK'; return; }

        artworks.unshift({ id: dbData.id, name: dbData.name, file_size: dbData.file_size, image_url: dbData.image_url, created_at: dbData.created_at });
        renderGallery();
        showToast('Work submitted to the museum archive.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'SUBMIT WORK';
        goBack();
      } catch (e) { console.error('Submit error:', e); showToast('Submission failed.'); submitBtn.disabled = false; submitBtn.textContent = 'SUBMIT WORK'; }
    }

    window.goBack = function() {
      galleryState.style.display = 'none'; 
      uploadState.style.display = 'flex'; 
      loadGallery();
    };

    function showToast(message) { toast.textContent = message; toast.classList.add('show'); setTimeout(() => { toast.classList.remove('show'); }, 3000); }

    function adjustStepLayout() {
      const slots = stepsRow.querySelectorAll('.step-slot img');
      if (slots.length === 0) return;

      const viewportW = window.innerWidth;
      const viewportH = window.innerHeight;
      const headerHeight = document.querySelector('header').offsetHeight;

      const paddingX = 80;
      const availableWidth = viewportW - paddingX;

      const paddingYTop = 40;
      const availableHeight = viewportH - headerHeight - paddingYTop - 40;

      const maxH = Math.min(0.4 * viewportH, availableHeight);

      let totalWidth = 0;
      slots.forEach(img => {
        const aspectRatio = img.naturalWidth / (img.naturalHeight || 1);
        totalWidth += (maxH * aspectRatio);
      });

      totalWidth += (slots.length - 1) * 40;

      let finalH = maxH;
      if (totalWidth > availableWidth) {
        finalH = (availableWidth - (slots.length - 1) * 40) / (totalWidth / maxH);
      }

      slots.forEach(img => {
        img.style.height = `${finalH}px`;
        img.style.width = 'auto';
      });
    }

    window.addEventListener('resize', adjustStepLayout);
    function canvasToBlob(canvas, mimeType = 'image/jpeg', quality = 0.85) {
      return new Promise((resolve, reject) => { canvas.toBlob((blob) => { if (blob) resolve(blob); else reject(new Error('Canvas toBlob failed.')); }, mimeType, quality); });
    }

    function renderBlockStyle(img, targetW, targetH, blockSize = 8) {
      const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
      const gridW = Math.max(1, Math.ceil(targetW / blockSize)); const gridH = Math.max(1, Math.ceil(targetH / blockSize));
      const offCanvas = document.createElement('canvas'); offCanvas.width = gridW; offCanvas.height = gridH;
      const offCtx = offCanvas.getContext('2d'); offCtx.imageSmoothingEnabled = false; offCtx.drawImage(img, 0, 0, gridW, gridH);
      canvas.width = targetW; canvas.height = targetH; ctx.imageSmoothingEnabled = false; ctx.drawImage(offCanvas, 0, 0, targetW, targetH);
      return canvas;
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => { if (img.naturalWidth === 0 || img.naturalHeight === 0) reject(new Error('Invalid image.')); else resolve(img); };
        img.onerror = () => reject(new Error('Failed to load image.'));
        img.src = URL.createObjectURL(file);
      });
    }

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      uploadState.style.display = 'none';
      galleryState.style.display = 'flex';
      stepsRow.innerHTML = '';
      finalImage.style.display = 'none';
      finalLabel.innerText = 'OPTIMIZING...';

      try {
        const img = await loadImage(file);
        const baseName = file.name.replace(/\.[^/.]+$/, "");
        const origW = img.naturalWidth;
        const origH = img.naturalHeight;
        const initialSize = file.size;
        const targetSize = 512;

        const ratio = targetSize / initialSize;
        const numSteps = ratio >= 1 ? 1 : Math.max(4, Math.min(6, 4 + Math.floor(Math.log10(1 / ratio) * 1.2)));

        let finalResult = null;

        for (let i = 1; i <= numSteps; i++) {
          const progress = i / numSteps;
          const targetForStep = initialSize * Math.pow(ratio, progress);
          const sizeFactor = targetForStep / initialSize;
          const dimScale = Math.max(0.05, Math.pow(sizeFactor, 0.5));
          const qualityScale = Math.max(0.01, sizeFactor);

          let currentW = Math.max(25, Math.floor(origW * dimScale));
          let currentH = Math.max(25, Math.floor(origH * dimScale));
          let currentQuality = Math.max(1, Math.min(100, Math.floor(qualityScale * 100)));

          const blockCanvas = renderBlockStyle(img, currentW, currentH, 8);
          const blob = await canvasToBlob(blockCanvas, 'image/jpeg', currentQuality / 100);
          const fileSize = blob.size;

          const slot = document.createElement('div');
          slot.className = 'step-slot';
          const slotImg = document.createElement('img');
          slotImg.src = URL.createObjectURL(blob);
          slotImg.onload = adjustStepLayout;
          const slotLabel = document.createElement('div');
          slotLabel.className = 'step-label';
          slotLabel.innerText = `STEP ${i}: ${fileSize} BYTES`;

          slot.appendChild(slotImg);
          slot.appendChild(slotLabel);
          stepsRow.appendChild(slot);
          adjustStepLayout();

          finalResult = { blob, name: `${baseName}_optimized.jpg`, size: fileSize };
          if (fileSize <= targetSize) break;
          await new Promise(r => setTimeout(r, 600));
        }

        if (finalResult) {
          const url = URL.createObjectURL(finalResult.blob);
          finalImage.src = url;
          finalImage.style.display = 'block';
          finalImage.alt = baseName;
          finalLabel.innerText = `FINAL STEP: ${finalResult.size} BYTES`;

          const stepSlots = stepsRow.querySelectorAll('.step-slot');
          for (let k = 0; k < stepSlots.length; k++) {
            const idx = stepSlots.length - 1 - k;
            if (idx >= 0) {
              const label = stepSlots[idx].querySelector('.step-label').innerText;
              const size = parseInt(label.match(/\d+/)[0]);
              if (Math.abs(size - finalResult.size) < 50) {
                URL.revokeObjectURL(stepSlots[idx].querySelector('img').src);
                stepsRow.removeChild(stepSlots[idx]);
              } else { break; }
            }
          }
        }
      } catch (e) { console.error('Optimization failed:', e); showToast('Optimization failed: ' + e.message); }
    });

    loadGallery();
  </script>
</body>
</html>
