<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUSEUM OF OPTIMISED ART</title>
  <style>
    /* === MUSEUM AESTHETIC (Strict 20px Spacing) === */
    :root {
      --font-main: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --color-bg: #ffffff;
      --color-text: #000000;
      --border-width: 2px;
      --border-color: #000000;
      --spacing: 20px;
      --gray-placeholder: #cccccc;
    }

    body {
      margin: 0; padding: 0;
      font-family: var(--font-main);
      background: var(--color-bg); color: var(--color-text);
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    header {
      padding: var(--spacing);
      border-bottom: var(--border-width) solid var(--border-color);
      text-align: center;
    }

    h1 {
      margin: 0; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 800;
    }

    /* Main Layout: 2 Rows (Top Steps, Bottom Final/Submit) */
    main {
      flex: 1; display: grid;
      grid-template-rows: 1fr 300px; /* Top takes remaining space, Bottom is fixed height */
      gap: var(--spacing);
      padding: var(--spacing);
      box-sizing: border-box;
    }

    /* Upload State */
    #uploadState {
      display: flex; flex: 1; justify-content: flex-end; align-items: flex-end;
    }

    .museum-btn {
      background: transparent; border: var(--border-width) solid var(--border-color);
      padding: 15px 30px; font-size: 1.2rem; font-weight: bold;
      text-transform: uppercase; cursor: pointer; transition: background 0.2s, color 0.2s;
    }
    .museum-btn:hover { background: var(--color-text); color: var(--color-bg); }

    /* Gallery State */
    #galleryState { display: none; }

    /* Top Row: Dynamic Steps */
    .steps-container {
      display: flex; flex-wrap: wrap; gap: var(--spacing);
      align-content: flex-start;
    }

    .step-slot {
      /* Flex item: grows, shrinks, starts at 0, maintains 1:1 aspect ratio */
      flex: 1 1 0; aspect-ratio: 1 / 1; min-width: 120px;
      border: var(--border-width) solid var(--border-color);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--gray-placeholder); position: relative;
    }
    .step-slot img {
      width: 100%; height: 100%; object-fit: contain; display: none;
    }
    .step-slot.loaded img { display: block; }

    .step-label {
      margin-top: 5px; font-size: 0.7rem; text-transform: uppercase;
      text-align: center; line-height: 1.2;
    }

    /* Bottom Row: Final + Submit */
    .bottom-container {
      display: flex; gap: var(--spacing);
    }

    /* Final Area (Bottom Left) */
    .final-area {
      flex: 1; aspect-ratio: 1 / 1;
      border: var(--border-width) solid var(--border-color);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--gray-placeholder);
    }
    .final-area img {
      width: 100%; height: 100%; object-fit: contain; display: none;
    }
    .final-area.loaded img { display: block; }

    /* Submit Area (Bottom Right) */
    .submit-area {
      flex: 0 0 250px; /* Fixed width for submit button */
      display: flex; align-items: flex-end;
    }

    #fileInput { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>MUSEUM OF OPTIMISED ART</h1>
  </header>

  <main>
    <!-- 1. Initial Upload State -->
    <div id="uploadState">
      <label for="fileInput" class="museum-btn">UPLOAD IMAGE</label>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <!-- 2. Processing / Gallery State -->
    <div id="galleryState">
      <!-- Top Row: Dynamic Steps (Wraps and fills width) -->
      <div id="topRow" class="steps-container"></div>
      
      <!-- Bottom Row: Final Result + Submit Button -->
      <div id="bottomRow" class="bottom-container">
        <div id="finalArea" class="final-area">
          <img id="finalImage" alt="Final Result">
          <div id="finalLabel" class="step-label">FINAL STEP: --- BYTES</div>
        </div>

        <div id="submitArea" class="submit-area">
          <button class="museum-btn" onclick="alert('Work submitted to the museum archive.')">SUBMIT WORK</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const fileInput = document.getElementById('fileInput');
    const uploadState = document.getElementById('uploadState');
    const galleryState = document.getElementById('galleryState');
    const topRow = document.getElementById('topRow');
    const finalArea = document.getElementById('finalArea');
    const finalImage = document.getElementById('finalImage');
    const finalLabel = document.getElementById('finalLabel');

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // UI Transition
      uploadState.style.display = 'none';
      galleryState.style.display = 'flex';
      
      // Clear previous results
      topRow.innerHTML = '';
      finalImage.src = '';
      finalArea.classList.remove('loaded');

      try {
        const img = await loadImage(file);
        const baseName = file.name.replace(/\.[^/.]+$/, "");
        const origW = img.naturalWidth;
        const origH = img.naturalHeight;

        // Options: Tuned for 4-6 steps, but dynamically handles any amount
        const options = {
          targetSizeBytes: 512,
          qualityStep: 20,
          dimensionStep: 0.2,
          maxIterations: 15, 
          MIN_DIM: 25,
          blockSize: 8
        };

        let prevFileSize = 0;
        let finalResult = null;

        // Dynamic Loop: Creates exactly as many blocks as needed
        for (let i = 1; i <= options.maxIterations; i++) {
          
          // Create a new DOM Slot for this step
          const slot = document.createElement('div');
          slot.className = 'step-slot';
          const slotImg = document.createElement('img');
          const slotLabel = document.createElement('div');
          slotLabel.className = 'step-label';
          
          slot.appendChild(slotImg);
          slot.appendChild(slotLabel);
          topRow.appendChild(slot);

          // --- OPTIMIZATION LOGIC (Matches Python exactly) ---
          const reductionFactor = Math.max(0, 1 - (i * options.dimensionStep));
          let currentW = Math.max(options.MIN_DIM, Math.floor(origW * reductionFactor));
          let currentH = Math.max(options.MIN_DIM, Math.floor(origH * reductionFactor));

          const currentQuality = Math.max(1, 100 - (i * options.qualityStep));
          const qualityNorm = currentQuality / 100;

          const blockCanvas = renderBlockStyle(img, currentW, currentH, options.blockSize);
          const blob = await canvasToBlob(blockCanvas, 'image/jpeg', qualityNorm);
          const fileSize = blob.size;

          // Update UI for this specific step
          slotImg.src = URL.createObjectURL(blob);
          slotLabel.innerText = `STEP ${i}: ${fileSize} BYTES`;
          slot.classList.add('loaded');

          // Success Check
          if (fileSize <= options.targetSizeBytes) {
            finalResult = { blob, name: `${baseName}_optimized.jpg`, size: fileSize };
            // Place final result in bottom left
            finalImage.src = URL.createObjectURL(blob);
            finalLabel.innerText = `FINAL STEP: ${finalResult.size} BYTES`;
            finalArea.classList.add('loaded');
            break;
          }

          // Stall Detection
          if (prevFileSize > 0 && Math.abs(fileSize - prevFileSize) < 50) {
             finalResult = finalResult || { blob, name: `${baseName}_optimized.jpg`, size: fileSize };
             finalImage.src = URL.createObjectURL(finalResult.blob);
             finalLabel.innerText = `FINAL STEP: ${finalResult.size} BYTES (Stalled)`;
             finalArea.classList.add('loaded');
             break;
          }
          
          if (!finalResult || fileSize < finalResult.size) {
            finalResult = { blob, name: `${baseName}_optimized.jpg`, size: fileSize };
          }

          prevFileSize = fileSize;
          await new Promise(r => setTimeout(r, 800)); 
        }

        // Fallback if loop finishes without hitting target
        if (!finalResult) {
          finalLabel.innerText = "ERROR: Could not reach target.";
        }

      } catch (e) {
        alert("Error: " + e.message);
        uploadState.style.display = 'flex';
        galleryState.style.display = 'none';
      }
    });

    function canvasToBlob(canvas, mimeType = 'image/jpeg', quality = 0.85) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error('Canvas toBlob failed.'));
        }, mimeType, quality);
      });
    }

    function renderBlockStyle(img, targetW, targetH, blockSize = 8) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const gridW = Math.max(1, Math.ceil(targetW / blockSize));
      const gridH = Math.max(1, Math.ceil(targetH / blockSize));

      const offCanvas = document.createElement('canvas');
      offCanvas.width = gridW;
      offCanvas.height = gridH;
      const offCtx = offCanvas.getContext('2d');
      offCtx.imageSmoothingEnabled = false;
      offCtx.drawImage(img, 0, 0, gridW, gridH);

      canvas.width = targetW;
      canvas.height = targetH;
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(offCanvas, 0, 0, targetW, targetH);
      return canvas;
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          if (img.naturalWidth === 0 || img.naturalHeight === 0) {
            reject(new Error('Invalid image.'));
          } else {
            resolve(img);
          }
        };
        img.onerror = () => reject(new Error('Failed to load image.'));
        img.src = URL.createObjectURL(file);
      });
    }
  </script>
</body>
</html>
