<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two-Phase Image Optimizer</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --accent: #38bdf8;
      --success: #22c55e; --warn: #f59e0b; --error: #ef4444; --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0; padding: 20px;
    }
    .container {
      background: var(--card); padding: 2rem; border-radius: 12px;
      border: 1px solid var(--border); width: 100%; max-width: 650px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 1.5rem; text-align: center; font-size: 1.4rem; }
    .upload-area {
      border: 2px dashed var(--border); padding: 1.5rem; text-align: center;
      border-radius: 8px; cursor: pointer; transition: 0.2s;
    }
    .upload-area:hover { border-color: var(--accent); background: rgba(56, 189, 248, 0.05); }
    input[type="file"] { display: none; }
    .btn {
      display: inline-block; padding: 10px 20px; background: var(--accent);
      color: #000; font-weight: 600; border-radius: 6px; text-decoration: none;
      cursor: pointer; transition: 0.2s; margin-top: 1rem; border: none; font-size: 1rem;
    }
    .btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .hidden { display: none !important; }
    
    .preview-section { margin-top: 1.5rem; text-align: center; }
    .preview-img {
      max-height: 200px; max-width: 100%; border-radius: 6px;
      margin: 10px 0; object-fit: contain; background: #000;
    }
    .preview-img.large { max-height: 450px; border: 2px solid var(--success); }
    .meta { font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.5rem; }

    .steps-section { margin-top: 1.5rem; }
    .steps-box {
      background: #0b1120; border: 1px solid var(--border); border-radius: 8px;
      padding: 1rem; max-height: 350px; overflow-y: auto;
    }
    .step-row {
      display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
      align-items: center;
    }
    .step-thumb {
      width: 60px; height: auto; border-radius: 4px; background: #000;
      object-fit: contain; flex-shrink: 0;
    }
    .step-info { font-family: monospace; font-size: 0.85rem; line-height: 1.4; }
    .step-info.success { color: var(--success); font-weight: bold; }
    .step-info.stalled { color: var(--warn); }
    .step-info.error { color: var(--error); }
    .step-info.phase { color: var(--accent); font-weight: 600; }

    .result-section { margin-top: 1.5rem; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎯 Two-Phase Image Optimizer</h1>
    
    <label class="upload-area" for="fileInput">
      📁 Click to upload image (PNG, JPG, WebP, etc.)
      <input type="file" id="fileInput" accept="image/*">
    </label>

    <div id="previewSection" class="preview-section hidden">
      <p class="meta" id="originalInfo"></p>
      <img id="originalPreview" class="preview-img" alt="Original Preview">
      <button id="convertBtn" class="btn">🔄 Convert & Show Steps</button>
    </div>

    <div id="stepsSection" class="steps-section hidden">
      <h3 style="margin: 0 0 0.5rem; font-size: 1rem;">📜 Optimization Steps</h3>
      <div id="stepsBox" class="steps-box"></div>
    </div>

    <div id="resultSection" class="result-section hidden">
      <h3 style="margin: 0 0 0.5rem; font-size: 1rem;">✅ Final Optimized Image</h3>
      <img id="finalPreview" class="preview-img large" alt="Final Preview">
      <a id="downloadLink" class="btn">⬇️ Download Final Image</a>
      <button id="resetBtn" class="btn" style="background: var(--border); color: var(--text); margin-left: 10px;">🔄 Reset</button>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const previewSection = document.getElementById('previewSection');
    const originalPreview = document.getElementById('originalPreview');
    const originalInfo = document.getElementById('originalInfo');
    const convertBtn = document.getElementById('convertBtn');
    const stepsSection = document.getElementById('stepsSection');
    const stepsBox = document.getElementById('stepsBox');
    const resultSection = document.getElementById('resultSection');
    const finalPreview = document.getElementById('finalPreview');
    const downloadLink = document.getElementById('downloadLink');
    const resetBtn = document.getElementById('resetBtn');

    const delay = ms => new Promise(r => setTimeout(r, ms));

    // FIXED: Properly wraps toBlob in a Promise (requires callback as 1st argument)
    function canvasToBlob(canvas, mimeType = 'image/jpeg', quality = 0.85) {
      return new Promise(resolve => {
        canvas.toBlob(resolve, mimeType, quality);
      });
    }

    // Simple color quantization to reduce color data without changing pixels
    function quantizeCanvas(canvas, numColors) {
      const ctx = canvas.getContext('2d');
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      
      const bits = Math.max(1, Math.ceil(Math.log2(numColors)));
      const step = 256 / Math.pow(2, bits);
      
      for (let i = 0; i < data.length; i += 4) {
        data[i]     = Math.round(data[i] / step) * step;
        data[i + 1] = Math.round(data[i + 1] / step) * step;
        data[i + 2] = Math.round(data[i + 2] / step) * step;
      }
      ctx.putImageData(imgData, 0, 0);
      return canvas;
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      const url = URL.createObjectURL(file);
      originalPreview.src = url;
      originalInfo.textContent = `${file.name} | ${(file.size/1024).toFixed(2)} KB | ${file.type.split('/')[1].toUpperCase()}`;
      
      previewSection.classList.remove('hidden');
      stepsSection.classList.add('hidden');
      resultSection.classList.add('hidden');
      convertBtn.disabled = false;
    });

    resetBtn.addEventListener('click', () => {
      fileInput.value = '';
      previewSection.classList.add('hidden');
      stepsSection.classList.add('hidden');
      resultSection.classList.add('hidden');
      stepsBox.innerHTML = '';
    });

    convertBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) return;
      
      convertBtn.disabled = true;
      stepsSection.classList.remove('hidden');
      resultSection.classList.add('hidden');
      stepsBox.innerHTML = '';

      const options = {
        targetSizeBytes: 512,
        dimensionStep: 0.12,
        maxIterations: 20,
        stallThreshold: 50,
        maxStalls: 5
      };

      try {
        const img = await loadImage(file);
        const baseName = file.name.replace(/\.[^/.]+$/, "");
        const STOP_DIM = 50;
        const COLOR_PALETTE_STEPS = [256, 128, 64, 32, 16, 8, 4, 2, 1];

        let currentW = img.naturalWidth;
        let currentH = img.naturalHeight;
        let colorStepIndex = 0;
        let prevFileSize = 0;
        let stallCount = 0;
        let finalResult = null;

        for (let i = 1; i <= options.maxIterations; i++) {
          let stepDesc = '';
          let blob;

          if (currentW > STOP_DIM || currentH > STOP_DIM) {
            currentW = Math.max(1, Math.floor(currentW * (1 - options.dimensionStep)));
            currentH = Math.max(1, Math.floor(currentH * (1 - options.dimensionStep)));
            
            const scaleCanvas = document.createElement('canvas');
            scaleCanvas.width = currentW;
            scaleCanvas.height = currentH;
            scaleCanvas.getContext('2d').drawImage(img, 0, 0, currentW, currentH);
            blob = await canvasToBlob(scaleCanvas, 'image/jpeg', 0.85); // FIXED
            stepDesc = `${currentW}x${currentH}`;
          } else {
            if (colorStepIndex < COLOR_PALETTE_STEPS.length) {
              const targetColors = COLOR_PALETTE_STEPS[colorStepIndex++];
              const colorCanvas = document.createElement('canvas');
              colorCanvas.width = Math.max(1, currentW);
              colorCanvas.height = Math.max(1, currentH);
              colorCanvas.getContext('2d').drawImage(img, 0, 0, colorCanvas.width, colorCanvas.height);
              quantizeCanvas(colorCanvas, targetColors);
              blob = await canvasToBlob(colorCanvas, 'image/png'); // FIXED
              stepDesc = `Colors: ${targetColors}`;
            } else {
              break;
            }
          }

          const fileSize = blob ? blob.size : 0;
          const stepDiv = document.createElement('div');
          stepDiv.className = 'step-row';
          
          const thumbUrl = URL.createObjectURL(blob);
          const thumb = document.createElement('img');
          thumb.src = thumbUrl;
          thumb.className = 'step-thumb';
          
          const info = document.createElement('div');
          info.className = 'step-info';
          const phase = (currentW > STOP_DIM || currentH > STOP_DIM) ? 'SCALE' : 'COLOR';
          info.textContent = `[${i}] Phase: ${phase} | ${stepDesc} | ${fileSize} bytes`;
          
          stepDiv.appendChild(thumb);
          stepDiv.appendChild(info);
          stepsBox.appendChild(stepDiv);
          stepsBox.scrollTop = stepsBox.scrollHeight;

          await delay(150);

          if (fileSize <= options.targetSizeBytes) {
            info.classList.add('success');
            info.textContent = `[${i}] ✅ Target Hit: ${stepDesc} | ${fileSize} bytes`;
            finalResult = { blob, name: `${baseName}_optimized.jpg`, size: fileSize };
            break;
          }

          if (prevFileSize > 0 && Math.abs(fileSize - prevFileSize) < options.stallThreshold) {
            stallCount++;
            if (stallCount >= options.maxStalls) {
              info.classList.add('stalled');
              info.textContent = `[${i}] ⏹️ Stalled at ${stepDesc} | ${fileSize} bytes`;
              finalResult = finalResult || { blob, name: `${baseName}_optimized.jpg`, size: fileSize };
              break;
            }
          } else {
            stallCount = 0;
          }
          prevFileSize = fileSize;

          if (!finalResult || fileSize < finalResult.size) {
            finalResult = { blob, name: `${baseName}_optimized.jpg`, size: fileSize };
          }
        }

        if (finalResult) {
          const url = URL.createObjectURL(finalResult.blob);
          finalPreview.src = url;
          resultSection.classList.remove('hidden');
          downloadLink.href = url;
          downloadLink.download = finalResult.name;
        } else {
          const warning = document.createElement('div');
          warning.className = 'step-info error';
          warning.textContent = `⚠️ Could not reach ≤${options.targetSizeBytes} bytes.`;
          stepsBox.appendChild(warning);
        }
      } catch (e) {
        console.error(e);
        const errorDiv = document.createElement('div');
        errorDiv.className = 'step-info error';
        errorDiv.textContent = `❌ Error: ${e.message}`;
        stepsBox.appendChild(errorDiv);
      } finally {
        convertBtn.disabled = false;
      }
    });

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          if (img.naturalWidth === 0 || img.naturalHeight === 0) {
            reject(new Error('Invalid or unsupported image file.'));
          } else {
            resolve(img);
          }
        };
        img.onerror = () => reject(new Error('Failed to load image. Try a different file format.'));
        img.src = URL.createObjectURL(file);
      });
    }
  </script>
</body>
</html>
