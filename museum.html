<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>70% Step Image Optimizer</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --accent: #38bdf8;
      --success: #22c55e; --warn: #f59e0b; --error: #ef4444; --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0; padding: 20px;
    }
    .container {
      background: var(--card); padding: 2rem; border-radius: 12px;
      border: 1px solid var(--border); width: 100%; max-width: 550px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 1.5rem; text-align: center; font-size: 1.4rem; }
    .upload-area {
      border: 2px dashed var(--border); padding: 1.5rem; text-align: center;
      border-radius: 8px; cursor: pointer; transition: 0.2s;
    }
    .upload-area:hover { border-color: var(--accent); background: rgba(56, 189, 248, 0.05); }
    input[type="file"] { display: none; }
    .btn {
      display: inline-block; padding: 10px 20px; background: var(--accent);
      color: #000; font-weight: 600; border-radius: 6px; text-decoration: none;
      cursor: pointer; transition: 0.2s; margin-top: 1rem; border: none; font-size: 1rem;
    }
    .btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .hidden { display: none !important; }
    
    .preview-section { margin-top: 1.5rem; text-align: center; }
    .preview-img {
      max-height: 200px; max-width: 100%; border-radius: 6px;
      margin: 10px 0; object-fit: contain; background: #000;
    }
    .preview-img.large { max-height: 450px; border: 2px solid var(--success); }
    .meta { font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.5rem; }

    .log-section { margin-top: 1.5rem; }
    .log-box {
      background: #0b1120; color: #94a3b8; font-family: monospace;
      padding: 1rem; border-radius: 6px; max-height: 280px; overflow-y: auto;
      font-size: 0.85rem; line-height: 1.4; border: 1px solid var(--border);
    }
    .log-box div { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .log-box div.success { color: var(--success); font-weight: bold; }
    .log-box div.stalled { color: var(--warn); }
    .log-box div.error { color: var(--error); }

    .result-section { margin-top: 1.5rem; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎯 70% Step Image Optimizer</h1>
    
    <label class="upload-area" for="fileInput">
      📁 Click to upload image (PNG, JPG, WebP, etc.)
      <input type="file" id="fileInput" accept="image/*">
    </label>

    <div id="previewSection" class="preview-section hidden">
      <p class="meta" id="originalInfo"></p>
      <img id="originalPreview" class="preview-img" alt="Original Preview">
      <button id="convertBtn" class="btn">🔄 Convert (70% Step)</button>
    </div>

    <div id="logSection" class="log-section hidden">
      <h3 style="margin: 0 0 0.5rem; font-size: 1rem;">📜 Optimization Steps</h3>
      <div id="logOutput" class="log-box"></div>
    </div>

    <div id="resultSection" class="result-section hidden">
      <h3 style="margin: 0 0 0.5rem; font-size: 1rem;">✅ Optimized Result</h3>
      <img id="finalPreview" class="preview-img large" alt="Final Preview">
      <a id="downloadLink" class="btn">⬇️ Download Optimized Image</a>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const previewSection = document.getElementById('previewSection');
    const originalPreview = document.getElementById('originalPreview');
    const originalInfo = document.getElementById('originalInfo');
    const convertBtn = document.getElementById('convertBtn');
    const logSection = document.getElementById('logSection');
    const logOutput = document.getElementById('logOutput');
    const resultSection = document.getElementById('resultSection');
    const finalPreview = document.getElementById('finalPreview');
    const downloadLink = document.getElementById('downloadLink');

    const delay = ms => new Promise(r => setTimeout(r, ms));

    function addLog(msg, type = '') {
      const line = document.createElement('div');
      line.textContent = msg;
      if (type) line.classList.add(type);
      logOutput.appendChild(line);
      logOutput.scrollTop = logOutput.scrollHeight;
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      const url = URL.createObjectURL(file);
      originalPreview.src = url;
      originalInfo.textContent = `${file.name} | ${(file.size/1024).toFixed(2)} KB | ${file.type.split('/')[1].toUpperCase()}`;
      
      previewSection.classList.remove('hidden');
      logSection.classList.add('hidden');
      resultSection.classList.add('hidden');
      convertBtn.disabled = false;
    });

    convertBtn.addEventListener('click', async () => {
      try {
        const file = fileInput.files[0];
        if (!file) return;
        
        convertBtn.disabled = true;
        logSection.classList.remove('hidden');
        resultSection.classList.add('hidden');
        logOutput.innerHTML = '';

        const img = await loadImage(file);
        const baseName = file.name.replace(/\.[^/.]+$/, "");
        const TARGET = 512;
        const TOLERANCE = 100;
        const MIN_DIM = 10; // Lowered from 100 to allow smaller files
        const SCALE_FACTOR = 0.3; // 70% reduction
        const QUALITY_STEP = 10;  // Quality drop per step
        const MAX_STEPS = 50;

        addLog(`📥 Processing: ${img.naturalWidth}x${img.naturalHeight}`);

        let currentW = img.naturalWidth;
        let currentH = img.naturalHeight;
        let quality = 85;
        let bestBlob = null;

        for (let i = 1; i <= MAX_STEPS; i++) {
          // 1. 70% Dimension Reduction
          currentW = Math.max(1, Math.floor(currentW * SCALE_FACTOR));
          currentH = Math.max(1, Math.floor(currentH * SCALE_FACTOR));

          // 2. Enforce 10px floor (preserves aspect ratio)
          const minDim = Math.min(currentW, currentH);
          if (minDim < MIN_DIM) {
             const adjust = MIN_DIM / minDim;
             currentW = Math.floor(currentW * adjust);
             currentH = Math.floor(currentH * adjust);
          }

          // 3. Reduce Quality (if dimensions are still large enough)
          // If dimensions are tiny, we rely on Quality 1
          if (currentW > 20 || currentH > 20) {
             quality = Math.max(1, quality - QUALITY_STEP);
          }

          // Generate blob
          const blob = await canvasToBlob(img, currentW, currentH, quality);
          addLog(`[Step ${i}] ${currentW}x${currentH} | Q:${quality} | ${blob.size} bytes`);

          // 4. Check if around 512 (±100 bytes)
          if (blob.size >= TARGET - TOLERANCE && blob.size <= TARGET + TOLERANCE) {
            bestBlob = blob;
            addLog(`✅ Hit target range (~512B) at ${currentW}x${currentH}`, 'success');
            break;
          }

          // Keep track of closest valid if we overshoot (go below 512)
          if (!bestBlob || (blob.size < bestBlob.size && blob.size > TARGET + TOLERANCE)) {
            bestBlob = blob;
          }

          await delay(50); // UI yield
        }

        // Final output
        const url = URL.createObjectURL(bestBlob);
        finalPreview.src = url;
        resultSection.classList.remove('hidden');
        downloadLink.href = url;
        downloadLink.download = `${baseName}_optimized.jpg`;
      } catch (e) {
        addLog(`❌ Critical Error: ${e.message}`, 'error');
        console.error(e);
      } finally {
        convertBtn.disabled = false;
      }
    });

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('Failed to load image. Try a different file format.'));
        img.src = URL.createObjectURL(file);
      });
    }

    function canvasToBlob(img, w, h, quality) {
      return new Promise((resolve, reject) => {
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');

        // Browser canvas limits (Chrome/Firefox/Safari)
        const MAX_SIZE = 16384;
        const MAX_PIXELS = 268435456; // ~268MP
        if (w > MAX_SIZE || h > MAX_SIZE || (w * h) > MAX_PIXELS) {
          return reject(new Error(`Canvas exceeds browser limits (${w}x${h}).`));
        }

        ctx.imageSmoothingQuality = 'high';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);

        const qNorm = Math.max(0.01, Math.min(1, quality / 100));

        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error(`toBlob failed at ${w}x${h} Q:${quality}`));
        }, 'image/jpeg', qNorm);
      });
    }
  </script>
</body>
</html>
