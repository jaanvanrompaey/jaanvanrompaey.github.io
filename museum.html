<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exact 512B Image Optimizer</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --accent: #38bdf8;
      --success: #22c55e; --warn: #f59e0b; --error: #ef4444; --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0; padding: 20px;
    }
    .container {
      background: var(--card); padding: 2rem; border-radius: 12px;
      border: 1px solid var(--border); width: 100%; max-width: 550px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 1.5rem; text-align: center; font-size: 1.4rem; }
    .upload-area {
      border: 2px dashed var(--border); padding: 1.5rem; text-align: center;
      border-radius: 8px; cursor: pointer; transition: 0.2s;
    }
    .upload-area:hover { border-color: var(--accent); background: rgba(56, 189, 248, 0.05); }
    input[type="file"] { display: none; }
    .btn {
      display: inline-block; padding: 10px 20px; background: var(--accent);
      color: #000; font-weight: 600; border-radius: 6px; text-decoration: none;
      cursor: pointer; transition: 0.2s; margin-top: 1rem; border: none; font-size: 1rem;
    }
    .btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .hidden { display: none !important; }
    
    .preview-section { margin-top: 1.5rem; text-align: center; }
    .preview-img {
      max-height: 200px; max-width: 100%; border-radius: 6px;
      margin: 10px 0; object-fit: contain; background: #000;
    }
    .preview-img.large { max-height: 450px; border: 2px solid var(--success); }
    .meta { font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.5rem; }

    .log-section { margin-top: 1.5rem; }
    .log-box {
      background: #0b1120; color: #94a3b8; font-family: monospace;
      padding: 1rem; border-radius: 6px; max-height: 280px; overflow-y: auto;
      font-size: 0.85rem; line-height: 1.4; border: 1px solid var(--border);
    }
    .log-box div { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .log-box div.success { color: var(--success); font-weight: bold; }
    .log-box div.stalled { color: var(--warn); }
    .log-box div.error { color: var(--error); }

    .result-section { margin-top: 1.5rem; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎯 Exact 512B Image Optimizer</h1>
    
    <label class="upload-area" for="fileInput">
      📁 Click to upload image (PNG, JPG, WebP, etc.)
      <input type="file" id="fileInput" accept="image/*">
    </label>

    <div id="previewSection" class="preview-section hidden">
      <p class="meta" id="originalInfo"></p>
      <img id="originalPreview" class="preview-img" alt="Original Preview">
      <button id="convertBtn" class="btn">🔄 Convert to Exact 512B</button>
    </div>

    <div id="logSection" class="log-section hidden">
      <h3 style="margin: 0 0 0.5rem; font-size: 1rem;">📜 Optimization Steps</h3>
      <div id="logOutput" class="log-box"></div>
    </div>

    <div id="resultSection" class="result-section hidden">
      <h3 style="margin: 0 0 0.5rem; font-size: 1rem;">✅ Exact 512B Result</h3>
      <img id="finalPreview" class="preview-img large" alt="Final Preview">
      <a id="downloadLink" class="btn">⬇️ Download Exact 512B Image</a>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const previewSection = document.getElementById('previewSection');
    const originalPreview = document.getElementById('originalPreview');
    const originalInfo = document.getElementById('originalInfo');
    const convertBtn = document.getElementById('convertBtn');
    const logSection = document.getElementById('logSection');
    const logOutput = document.getElementById('logOutput');
    const resultSection = document.getElementById('resultSection');
    const finalPreview = document.getElementById('finalPreview');
    const downloadLink = document.getElementById('downloadLink');

    const delay = ms => new Promise(r => setTimeout(r, ms));

    function addLog(msg, type = '') {
      const line = document.createElement('div');
      line.textContent = msg;
      if (type) line.classList.add(type);
      logOutput.appendChild(line);
      logOutput.scrollTop = logOutput.scrollHeight;
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      const url = URL.createObjectURL(file);
      originalPreview.src = url;
      originalInfo.textContent = `${file.name} | ${(file.size/1024).toFixed(2)} KB | ${file.type.split('/')[1].toUpperCase()}`;
      
      previewSection.classList.remove('hidden');
      logSection.classList.add('hidden');
      resultSection.classList.add('hidden');
      convertBtn.disabled = false;
    });

    convertBtn.addEventListener('click', async () => {
      try {
        const file = fileInput.files[0];
        if (!file) return;
        
        convertBtn.disabled = true;
        logSection.classList.remove('hidden');
        resultSection.classList.add('hidden');
        logOutput.innerHTML = '';

        const img = await loadImage(file);
        const baseName = file.name.replace(/\.[^/.]+$/, "");
        const TARGET = 512;
        const MIN_DIM = 100;

        addLog(`📥 Processing: ${img.naturalWidth}x${img.naturalHeight} (${(file.size/1024).toFixed(1)} KB)`);

        // Phase 1: Aggressive dimension scaling until Q:1 would be close to target
        let scale = 1.0;
        const MAX_CANVAS = 16384;
        
        if (img.naturalWidth > MAX_CANVAS || img.naturalHeight > MAX_CANVAS) {
          throw new Error('Image exceeds browser canvas limits. Try a smaller file.');
        }

        let finalW = img.naturalWidth;
        let finalH = img.naturalHeight;

        while (scale > 0.005) {
          let w = Math.floor(img.naturalWidth * scale);
          let h = Math.floor(img.naturalHeight * scale);
          
          // Proportionally enforce 100px minimum on shortest edge
          const minDim = Math.min(w, h);
          if (minDim < MIN_DIM) {
            const adjust = MIN_DIM / minDim;
            w = Math.floor(w * adjust);
            h = Math.floor(h * adjust);
          }

          // Test what Q:1 would produce at these dimensions
          const blobQ1 = await canvasToBlob(img, w, h, 1);
          addLog(`[Scale] ${w}x${h} | Q:1 estimate: ${blobQ1.size} bytes`);

          // Stop scaling when Q:1 is within 3x target (gives quality search room)
          if (blobQ1.size <= TARGET * 3) {
            finalW = w;
            finalH = h;
            break;
          }

          scale *= 0.85; // 15% reduction per step
          await delay(40);
        }

        // Phase 2: Binary search quality for exact ~512 bytes
        let qLow = 1, qHigh = 100;
        let bestBlob = null;

        while (qHigh - qLow > 1) {
          const qMid = Math.floor((qLow + qHigh) / 2);
          const blob = await canvasToBlob(img, finalW, finalH, qMid);
          addLog(`[Q-Search] ${finalW}x${finalH} | Q:${qMid} | ${blob.size} bytes`);

          if (blob.size <= TARGET) {
            bestBlob = blob;
            qLow = qMid; // Try higher quality while staying ≤512
          } else {
            qHigh = qMid; // Need lower quality to shrink further
          }
          await delay(30);
        }

        // Final selection: highest quality that stays ≤512
        const finalBlob = bestBlob || await canvasToBlob(img, finalW, finalH, 50);
        const finalQ = bestBlob ? qLow : 50;
        const outputName = `${baseName}_exact512.jpg`;

        addLog(`✅ Final: ${finalW}x${finalH} | Q:${finalQ} | ${finalBlob.size} bytes (Target: ~512)`, 'success');

        const url = URL.createObjectURL(finalBlob);
        finalPreview.src = url;
        resultSection.classList.remove('hidden');
        downloadLink.href = url;
        downloadLink.download = outputName;
      } catch (e) {
        addLog(`❌ Error: ${e.message}`, 'error');
        console.error(e);
      } finally {
        convertBtn.disabled = false;
      }
    });

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('Failed to load image. Try a different file format.'));
        img.src = URL.createObjectURL(file);
      });
    }

    function canvasToBlob(img, w, h, quality) {
      return new Promise((resolve, reject) => {
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        
        ctx.imageSmoothingQuality = 'high';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        
        // Quality 1-100 maps to 0.01-1.0 for Canvas API
        const qNorm = Math.max(0.01, quality / 100);
        
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error('Canvas toBlob failed. Check browser compatibility.'));
        }, 'image/jpeg', qNorm);
      });
    }
  </script>
</body>
</html>
