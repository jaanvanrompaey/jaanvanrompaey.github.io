<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUSEUM OF OPTIMISED ART</title>
  <style>
    /* === MUSEUM AESTHETIC === */
    :root {
      --font-main: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --color-bg: #ffffff;
      --color-text: #000000;
      --border-width: 2px;
      --border-color: #000000;
      --gray-placeholder: #cccccc;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-main);
      background: var(--color-bg);
      color: var(--color-text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden; /* Prevent scrolling, fit to screen */
    }

    /* Header */
    header {
      padding: 20px;
      border-bottom: var(--border-width) solid var(--border-color);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 800;
    }

    /* Main Layout */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 20px;
    }

    /* Upload State */
    #uploadState {
      display: flex;
      flex: 1;
      justify-content: flex-end; /* Align bottom right */
      align-items: flex-end;
      padding-bottom: 40px;
      padding-right: 40px;
    }

    .museum-btn {
      background: transparent;
      border: var(--border-width) solid var(--border-color);
      padding: 15px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .museum-btn:hover {
      background: var(--color-text);
      color: var(--color-bg);
    }

    /* Gallery / Steps Grid */
    #galleryState {
      display: none; /* Hidden initially */
      flex: 1;
      flex-direction: column;
      gap: 15px;
      height: 100%;
    }

    /* The Row of 5 Steps */
    .steps-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr); /* 5 equal columns */
      gap: 10px;
      height: 60%; /* Takes up 60% of the gallery space */
      align-items: center;
    }

    .step-slot {
      border: 1px solid var(--border-color);
      aspect-ratio: 1 / 1; /* Square */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--gray-placeholder); /* Placeholder color */
      position: relative;
    }

    .step-slot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none; /* Hidden until loaded */
    }

    .step-slot.loaded img {
      display: block;
    }

    .step-label {
      margin-top: 5px;
      font-size: 0.7rem;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.2;
    }

    /* Bottom Section (Final + Submit) */
    .bottom-section {
      display: flex;
      height: 35%; /* Takes up 35% of gallery space */
      gap: 20px;
    }

    /* Final Result Area */
    #finalArea {
      flex: 1;
      border: var(--border-width) solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--gray-placeholder);
    }

    #finalArea img {
      max-width: 90%;
      max-height: 80%;
      object-fit: contain;
      display: none;
    }

    #finalArea.loaded img {
      display: block;
    }

    #finalLabel {
      margin-top: 10px;
      font-size: 0.8rem;
      text-transform: uppercase;
      text-align: center;
    }

    /* Submit Button Area */
    #submitArea {
      flex: 0 0 250px; /* Fixed width for button area */
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding-bottom: 10px;
    }

    /* Hidden Input */
    #fileInput {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>MUSEUM OF OPTIMISED ART</h1>
  </header>

  <main>
    <!-- 1. Initial Upload State -->
    <div id="uploadState">
      <label for="fileInput" class="museum-btn">
        UPLOAD IMAGE
      </label>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <!-- 2. Processing / Gallery State -->
    <div id="galleryState">
      <!-- The 5 Steps Row -->
      <div class="steps-row" id="stepsRow">
        <!-- Generated by JS: 5 slots -->
      </div>

      <!-- Bottom Section -->
      <div class="bottom-section">
        <!-- Final Result -->
        <div id="finalArea">
          <img id="finalImage" alt="Final Result">
          <div id="finalLabel">FINAL STEP: --- BYTES</div>
        </div>

        <!-- Submit Button -->
        <div id="submitArea">
          <button class="museum-btn" onclick="alert('Work submitted to the museum archive.')">
            SUBMIT WORK
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const fileInput = document.getElementById('fileInput');
    const uploadState = document.getElementById('uploadState');
    const galleryState = document.getElementById('galleryState');
    const stepsRow = document.getElementById('stepsRow');
    const finalArea = document.getElementById('finalArea');
    const finalImage = document.getElementById('finalImage');
    const finalLabel = document.getElementById('finalLabel');

    // Initialize the 5 Step Slots in HTML
    for (let i = 1; i <= 5; i++) {
      const slot = document.createElement('div');
      slot.className = 'step-slot';
      slot.id = `step-${i}`;
      
      const img = document.createElement('img');
      img.src = ''; 
      img.alt = `Step ${i}`;
      
      const label = document.createElement('div');
      label.className = 'step-label';
      label.innerText = `STEP ${i}: --- BYTES`;

      slot.appendChild(img);
      slot.appendChild(label);
      stepsRow.appendChild(slot);
    }

    // Helper: Canvas to Blob
    function canvasToBlob(canvas, mimeType = 'image/jpeg', quality = 0.85) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error('Canvas toBlob failed.'));
        }, mimeType, quality);
      });
    }

    // Helper: Heavy Block Rendering
    function renderBlockStyle(img, targetW, targetH, blockSize = 8) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const gridW = Math.max(1, Math.ceil(targetW / blockSize));
      const gridH = Math.max(1, Math.ceil(targetH / blockSize));

      const offCanvas = document.createElement('canvas');
      offCanvas.width = gridW;
      offCanvas.height = gridH;
      const offCtx = offCanvas.getContext('2d');
      offCtx.imageSmoothingEnabled = false;
      offCtx.drawImage(img, 0, 0, gridW, gridH);

      canvas.width = targetW;
      canvas.height = targetH;
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(offCanvas, 0, 0, targetW, targetH);
      return canvas;
    }

    // Helper: Load Image
    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          if (img.naturalWidth === 0 || img.naturalHeight === 0) {
            reject(new Error('Invalid image.'));
          } else {
            resolve(img);
          }
        };
        img.onerror = () => reject(new Error('Failed to load image.'));
        img.src = URL.createObjectURL(file);
      });
    }

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // UI Transition
      uploadState.style.display = 'none';
      galleryState.style.display = 'flex';
      
      // Reset UI
      document.querySelectorAll('.step-slot').forEach(slot => {
        slot.classList.remove('loaded');
        slot.querySelector('img').src = '';
        slot.querySelector('.step-label').innerText = `STEP ${slot.id.split('-')[1]}: --- BYTES`;
      });
      finalArea.classList.remove('loaded');
      finalImage.src = '';
      finalLabel.innerText = 'FINAL STEP: --- BYTES';

      try {
        const img = await loadImage(file);
        const baseName = file.name.replace(/\.[^/.]+$/, "");
        const origW = img.naturalWidth;
        const origH = img.naturalHeight;

        // Options (Tuned for 5 steps)
        const options = {
          targetSizeBytes: 512,
          qualityStep: 20,
          dimensionStep: 0.2,
          maxIterations: 5, // Matches the 5 visual slots
          MIN_DIM: 25,
          blockSize: 8
        };

        let prevFileSize = 0;
        let finalResult = null;

        for (let i = 1; i <= options.maxIterations; i++) {
          // Linear Dimension Reduction
          const reductionFactor = Math.max(0, 1 - (i * options.dimensionStep));
          let currentW = Math.max(options.MIN_DIM, Math.floor(origW * reductionFactor));
          let currentH = Math.max(options.MIN_DIM, Math.floor(origH * reductionFactor));

          // Linear Quality Reduction
          const currentQuality = Math.max(1, 100 - (i * options.qualityStep));
          const qualityNorm = currentQuality / 100;

          // Render
          const blockCanvas = renderBlockStyle(img, currentW, currentH, options.blockSize);
          const blob = await canvasToBlob(blockCanvas, 'image/jpeg', qualityNorm);
          const fileSize = blob.size;

          // Update UI for this step
          const slot = document.getElementById(`step-${i}`);
          const slotImg = slot.querySelector('img');
          const slotLabel = slot.querySelector('.step-label');

          slotImg.src = URL.createObjectURL(blob);
          slotLabel.innerText = `STEP ${i}: ${fileSize} BYTES`;
          slot.classList.add('loaded');

          // Success Check
          if (fileSize <= options.targetSizeBytes) {
            finalResult = { blob, name: `${baseName}_optimized.jpg`, size: fileSize };
            break;
          }

          // Stall Detection
          if (prevFileSize > 0 && Math.abs(fileSize - prevFileSize) < 50) {
             // If stalled, just take the current one as best available
             finalResult = finalResult || { blob, name: `${baseName}_optimized.jpg`, size: fileSize };
             break;
          }
          
          // Track best result
          if (!finalResult || fileSize < finalResult.size) {
            finalResult = { blob, name: `${baseName}_optimized.jpg`, size: fileSize };
          }

          prevFileSize = fileSize;
          
          // Delay for "one by one" reveal
          await new Promise(r => setTimeout(r, 800)); 
        }

        // Display Final Result
        if (finalResult) {
          const url = URL.createObjectURL(finalResult.blob);
          finalImage.src = url;
          finalLabel.innerText = `FINAL STEP: ${finalResult.size} BYTES`;
          finalArea.classList.add('loaded');
        } else {
          finalLabel.innerText = "ERROR: Could not optimize.";
        }

      } catch (e) {
        alert("Error: " + e.message);
        // Reset to upload state
        uploadState.style.display = 'flex';
        galleryState.style.display = 'none';
      }
    });
  </script>
</body>
</html>
