<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linear Image Optimizer</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --accent: #38bdf8;
      --success: #22c55e; --warn: #f59e0b; --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0; padding: 20px;
    }
    .container {
      background: var(--card); padding: 2rem; border-radius: 12px;
      border: 1px solid var(--border); width: 100%; max-width: 500px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h1 { margin: 0 0 1.5rem; text-align: center; font-size: 1.5rem; }
    .upload-area {
      border: 2px dashed var(--border); padding: 2rem; text-align: center;
      border-radius: 8px; cursor: pointer; transition: 0.2s;
    }
    .upload-area:hover { border-color: var(--accent); background: rgba(56, 189, 248, 0.05); }
    input[type="file"] { display: none; }
    .btn {
      display: inline-block; padding: 10px 20px; background: var(--accent);
      color: #000; font-weight: 600; border-radius: 6px; text-decoration: none;
      cursor: pointer; transition: 0.2s; margin-top: 1rem;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn.hidden { display: none; }
    #status {
      margin-top: 1.5rem; padding: 1rem; background: rgba(0,0,0,0.2);
      border-radius: 6px; font-family: monospace; font-size: 0.9rem;
      white-space: pre-wrap; min-height: 60px;
    }
    .config { margin-top: 1rem; font-size: 0.85rem; color: #94a3b8; }
    .config label { display: block; margin-bottom: 0.5rem; }
    .config input {
      background: #0f172a; border: 1px solid var(--border); color: var(--text);
      padding: 4px 8px; border-radius: 4px; width: 80px; text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🖼️ Linear Image Optimizer</h1>
    
    <label class="upload-area" for="fileInput">
      📁 Click to upload image (PNG, JPG, WebP, etc.)
      <input type="file" id="fileInput" accept="image/*">
    </label>

    <div class="config">
      <label>Target Size (bytes): <input type="number" id="targetSize" value="512"></label>
      <label>Quality Step: <input type="number" id="qualityStep" value="10"></label>
      <label>Dimension Step: <input type="number" id="dimStep" value="0.1" step="0.01"></label>
    </div>

    <div id="status">Waiting for image...</div>
    <a id="downloadLink" class="btn hidden" download>⬇️ Download Optimized Image</a>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const statusEl = document.getElementById('status');
    const downloadLink = document.getElementById('downloadLink');

    // UI Helpers
    function updateStatus(msg, size = null) {
      statusEl.textContent = msg + (size !== null ? ` | ${size} bytes` : '');
    }

    function showDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      downloadLink.href = url;
      downloadLink.download = filename;
      downloadLink.classList.remove('hidden');
    }

    // Core Logic
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // Reset UI
      downloadLink.classList.add('hidden');
      updateStatus(`Processing: ${file.name} (${(file.size/1024).toFixed(1)} KB)`);

      const options = {
        targetSizeBytes: parseInt(document.getElementById('targetSize').value) || 512,
        qualityStep: parseInt(document.getElementById('qualityStep').value) || 10,
        dimensionStep: parseFloat(document.getElementById('dimStep').value) || 0.1,
        maxIterations: 20,
        stallThreshold: 50,
        maxStalls: 5
      };

      const result = await optimizeImage(file, options);
      
      if (result) {
        showDownload(result.blob, result.name);
      } else {
        updateStatus(`⚠️ Warning: Could not reach ≤${options.targetSizeBytes} bytes within limits.`);
      }
    });

    async function optimizeImage(file, options) {
      const img = await loadImage(file);
      const baseName = file.name.replace(/\.[^/.]+$/, "");
      const outExt = '.jpg';

      let prevFileSize = Infinity;
      let stallCount = 0;

      for (let i = 1; i <= options.maxIterations; i++) {
        const reductionFactor = Math.max(0.0, 1.0 - (i * options.dimensionStep));
        const newW = Math.max(1, Math.floor(img.width * reductionFactor));
        const newH = Math.max(1, Math.floor(img.height * reductionFactor));
        const currentQuality = Math.max(1, 100 - (i * options.qualityStep));

        const outputName = `${baseName}_v${i}${outExt}`;
        updateStatus(`[${i}] ${newW}x${newH} | Q:${currentQuality}`);

        const blob = await canvasToBlob(img, newW, newH, currentQuality);
        const fileSize = blob.size;

        updateStatus(`[${i}] ${newW}x${newH} | Q:${currentQuality} | ${fileSize} bytes`, fileSize);

        if (fileSize <= options.targetSizeBytes) {
          updateStatus(`✅ Success! Final file: ${outputName} (${fileSize} bytes)`);
          return { blob, name: outputName, size: fileSize };
        }

        if (Math.abs(fileSize - prevFileSize) < options.stallThreshold) {
          stallCount++;
          if (stallCount >= options.maxStalls) {
            updateStatus(`⏹️ Linear optimization stalled. Returning best available: ${outputName}`);
            return { blob, name: outputName, size: fileSize };
          }
        } else {
          stallCount = 0;
        }
        prevFileSize = fileSize;
      }

      updateStatus(`⚠️ Warning: Could not reach ≤${options.targetSizeBytes} bytes.`);
      return null;
    }

    // Browser API Helpers
    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }

    function canvasToBlob(img, w, h, quality) {
      return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        
        // JPEG doesn't support transparency. Fill with white background.
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        
        // quality is 0-1 for toBlob, Python uses 0-100
        canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality / 100);
      });
    }
  </script>
</body>
</html>
